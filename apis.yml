description: CubeSmart (NYSE CUBE) is a self-administered and self-managed real estate investment trust (REIT) and the third-largest owner and operator of self-storage properties in the United States. As of December 31, 2024 the company owns 631 self-storage properties across 25 states and Washington DC, containing approximately 45.8 million rentable square feet, and operates a third-party management platform that pushes the total managed network well past 1,300 properties. Headquartered in Malvern, Pennsylvania, CubeSmart originated as U-Store-It Trust (founded July 2004, IPO October 2004) and rebranded to CubeSmart on September 14, 2011. The company is a component of the S&P 400. CubeSmart does not publish a public developer API, OpenAPI specification, SDK, or developer portal — its public technology footprint is limited to the consumer cubesmart.com booking/account site and the CubeSmart mobile apps for iOS and Android.
